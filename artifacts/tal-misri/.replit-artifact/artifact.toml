kind = "web"
previewPath = "/"
title = "Tal Misri Factory App"
version = "1.0.0"
id = "artifacts/tal-misri"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23220

[services.development]
run = "pnpm --filter @workspace/tal-misri run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tal-misri", "run", "build" ]
publicDir = "artifacts/tal-misri/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23220"
BASE_PATH = "/"
